openapi: 3.0.3
info:
  title: Instabase Document Analysis API
  description: API pour l'analyse de documents via l'API Instabase AI Hub en utilisant une architecture hexagonale.
  version: 0.0.1
  contact:
    name: xAI Support
    url: https://x.ai/api
servers:
  - url: http://localhost:8080
    description: Serveur local pour développement
  - url: https://api.instabase-hexagonal.com
    description: Serveur de production (exemple)
paths:
  /api/documents/analysis:
    post:
      summary: Lancer l'analyse d'un ou plusieurs documents
      description: Crée un batch, téléverse les documents, et optionnellement lance une analyse via l'API Instabase.
      operationId: analysisDocuments
      tags:
        - Documents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Liste des fichiers à analyser (PDF, images, etc.).
                launchAnalysis:
                  type: boolean
                  default: true
                  description: Indique si l'analyse doit être lancée immédiatement.
                appName:
                  type: string
                  default: app_doc_classification
                  description: Nom de l'application Instabase à utiliser pour l'analyse.
              required:
                - files
      responses:
        '200':
          description: Analyse initiée avec succès ou batch créé sans analyse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          description: Requête invalide (ex. : fichiers manquants ou invalides).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur serveur lors du traitement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/documents/result/{batchId}:
    get:
      summary: Récupérer les résultats d'un batch
      description: Récupère les résultats d'un batch précédemment créé via l'API Instabase.
      operationId: getBatchResult
      tags:
        - Documents
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
          description: Identifiant du batch à consulter.
      responses:
        '200':
          description: Résultats du batch récupérés avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '404':
          description: Batch non trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur serveur lors de la récupération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    BatchResult:
      type: object
      properties:
        batchId:
          type: string
          description: Identifiant du batch ou de l'exécution.
          example: batch_123456
        status:
          type: string
          description: Statut du traitement (ex. : PENDING, COMPLETE).
          example: COMPLETE
        resultDetails:
          type: string
          description: Détails des résultats, au format JSON brut de l'API Instabase.
          example: '{"batch_id": "batch_123456", "files": [{"original_file_name": "kbis.pdf", "documents": [{"class_name": "Kbis"}]}]}'
      required:
        - batchId
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Message d'erreur.
          example: Failed to process documents
        details:
          type: string
          description: Détails supplémentaires sur l'erreur.
          example: Invalid file format
      required:
        - error
tags:
  - name: Documents
    description: Opérations liées à l'analyse et à la récupération des résultats des documents.